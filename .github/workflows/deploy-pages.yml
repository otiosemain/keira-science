name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .nojekyll *.html _site/
          # PDFs are stored as base64 text (*.pdf.b64) and decoded here
          # large PDFs are split: name.pdf.b64 + name.pdf.b64.1, .2 ... (concatenated in order)
          for f in *.pdf.b64; do
            cat "$f" $(ls "$f".* 2>/dev/null | sort -t. -k4 -n) | base64 -d > "_site/${f%.b64}"
          done
          for f in *.pdf; do
            [ -f "$f" ] && [ ! -f "_site/$f" ] && cp "$f" _site/ || true
          done
          python3 - <<'PY'
          from pathlib import Path
          need = ["notes-units1-4.pdf", "notes-units5-10.pdf", "question-bank.pdf", "exam-papers.pdf", "answer-key.pdf", "summaries.pdf"]
          for n in need:
              p = Path("_site") / n
              head = p.read_bytes()[:5]
              if head != b"%PDF-":
                  raise SystemExit(f"{p} is not a PDF, starts with {head!r}")
              print(p, "ok", p.stat().st_size)
          for n in ["index.html", "exam.html", "exam-midyear.html", "exam-yearend-1.html", "exam-guide.html", "syllabus-map.html"]:
              assert (Path("_site") / n).exists(), n
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
